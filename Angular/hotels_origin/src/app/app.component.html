@let stores = {
  currentSingleName: store.currentSingleName()
};

@let collectProps = {
  toggleCollect: toggleCollect()
};

<div class="header">
  <div class="title">
    <h1 [class]="{ 'title-toggle': stores.currentSingleName !== '' }">Hotels</h1>
    <div class="collect-btn" (click)="toggleCollect.set(true)">收藏旅館</div>
  </div>
  <div 
    class="current-single-name" 
    [class]="{ 'single-name-toggle': stores.currentSingleName !== '' }"
  >
    {{ stores.currentSingleName || '' }}
  </div>
  <div class="right">
    <div 
      class="search-groups-outer" 
      [class]="{ 'search-toggle': stores.currentSingleName === '' }"
    >
      <app-search-group />
    </div>
    <div class="collect-btn" (click)="toggleCollect.set(true)">收藏旅館</div>
  </div>
</div>
<div class="main">
  <router-outlet></router-outlet>
</div>
<div class="footer">
  <h6>CopyRight &copy; 2024-10 Alex Chen .</h6>
</div>

<app-filter-box />
<app-collect 
  [propsToggle]="collectProps.toggleCollect" 
  (postToggle)="toggleCollect.set($event)"
/>
