@let props = {
  propsModalToggle: propsModalToggle(),
  propsModalContent: propsModalContent()
};

<div 
  class="alert-modal-outer-frame" 
  [class]="{ 'alert-modal-outer-frame-active': props.propsModalToggle }"
>
  <div 
    class="alert-modal-outer" 
    [class]="{ 'alert-modal-outer-active': props.propsModalToggle }"
  >
    <div class="alert-modal">
      <div class="alert-modal-header">{{ props.propsModalContent.msTitle }}</div>
      <div class="alert-modal-body">{{ props.propsModalContent.msContent }}</div>
      <div class="alert-modal-footer">
        <div class="confirm-c" (click)="closeModal()">確定</div>
      </div>
    </div>
  </div>
</div>
