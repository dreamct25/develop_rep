@let templateParams = {
  searchVal: state.valGroup.searchVal
};

<div class="search-group-outer">
  <div class="search-bar">
    <input type="text" [formField]="templateParams.searchVal" />
    <div class="search-btn" (click)="searching()">搜尋</div>
  </div>
  <div class="filter-btn" (click)="filterOpen()">篩選</div>
</div>
