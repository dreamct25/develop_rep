@let props = {
  propsModalToggle: propsModalToggle(),
  propsModalContent: propsModalContent()
};

<div 
  class="interactive-modal-outer-frame" 
  [class]="{ 'interactive-modal-outer-frame-active': props.propsModalToggle }"
>
  <div class="interactive-modal-outer">
    <div class="interactive-modal">
      <div class="interactive-modal-header">{{ props.propsModalContent.msTitle }}</div>
      <div class="interactive-modal-body">{{ props.propsModalContent.msContent }}</div>
      <div class="interactive-modal-footer">
        <div class="confirm" (click)="closeModal(true)">確定</div>
        <div class="cancel" (click)="closeModal(false)">取消</div>
      </div>
    </div>
  </div>
</div>
